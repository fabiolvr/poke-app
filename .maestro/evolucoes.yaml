appId: ${APP_ID}
name: Busca, filtro por tipo, evoluções e comparação
---
- runFlow: subflows/abrir-app.yaml

# Busca por nome. Esconder o teclado é opcional: com o teclado do Mac ligado ao simulador, não há teclado na tela.
- tapOn: "Buscar por nome ou número"
- inputText: "char"
- assertVisible: "Charmander.*"
- assertVisible: "Charizard.*"
- assertNotVisible: "Bulbasaur.*"
- hideKeyboard:
    optional: true
- takeScreenshot: .maestro/capturas/evolucoes-01-busca

# Filtro por tipo, combinado com a busca
- tapOn: "Filtrar"
- assertVisible: "FILTRAR"
- takeScreenshot: .maestro/capturas/evolucoes-02-folha-filtros
- tapOn: "Tipo Fogo"
- tapOn: "Ver resultados"
- assertVisible: "Remover filtro Fogo"
- assertVisible: "Charmander.*"
- tapOn: "Remover filtro Fogo"
- tapOn: "Limpar busca"
- assertVisible: "Bulbasaur.*"

# Dois tipos: Fogo e Voador é o Charizard, não o Charmander.
- tapOn: "Filtrar"
- tapOn: "Tipo Fogo"
- tapOn: "Tipo Voador"
# Com dois tipos, os outros ficam desligados.
- assertVisible:
    text: "Tipo Água"
    enabled: false
- tapOn: "Ver resultados"
- assertVisible: "Charizard.*"
- assertNotVisible: "Charmander.*"
- tapOn: "Remover filtro Fogo"
- tapOn: "Remover filtro Voador"

# Geração: Johto começa no Chikorita (#0152).
- tapOn: "Filtrar"
- tapOn: "Geração 2, Johto"
- tapOn: "Ver resultados"
- assertVisible: "Remover filtro Johto"
- assertVisible: "Chikorita.*"
- assertNotVisible: "Bulbasaur.*"
- takeScreenshot: .maestro/capturas/evolucoes-03-geracao
- tapOn: "Remover filtro Johto"
- assertVisible: "Bulbasaur.*"

# Busca por número: "25" é só o Pikachu, sem o #0250 Ho-Oh nem o #0002 Ivysaur.
- tapOn: "Buscar por nome ou número"
- inputText: "25"
- assertVisible: "Pikachu, número 25.*"
- assertNotVisible: "Ho-oh.*"
- assertNotVisible: "Ivysaur.*"
- tapOn: "Limpar busca"
- assertVisible: "Bulbasaur.*"

# Linha evolutiva. O rótulo completo evita acertar o campo de busca, que também contém "eevee".
- tapOn: "Buscar por nome ou número"
- inputText: "eevee"
- hideKeyboard:
    optional: true
- tapOn: "Eevee, número 133.*"
- scrollUntilVisible:
    element: "Vaporeon.*"
    direction: DOWN
    visibilityPercentage: 50
- takeScreenshot: .maestro/capturas/evolucoes-04-linha-evolutiva
- tapOn: "Vaporeon.*"
- assertVisible: "Água"

# Comparação: Vaporeon e Jolteon somam 525 cada.
- scrollUntilVisible:
    element: "Comparar status"
    direction: UP
- tapOn: "Comparar status"
- assertVisible: "QUEM ENFRENTA VAPOREON?"
- tapOn: "Buscar adversário"
- inputText: "jolteon"
- hideKeyboard:
    optional: true
- tapOn: "Jolteon, número 135"
- scrollUntilVisible:
    element: "Empate: os dois somam 525."
    direction: DOWN
- takeScreenshot: .maestro/capturas/evolucoes-05-comparacao
