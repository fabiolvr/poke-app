appId: ${APP_ID}
name: Pokédex, detalhes e favoritos
---
- runFlow: subflows/abrir-app.yaml

# Grade com paginação: o Clefairy (#0035) só chega na segunda página.
# Timeout de 60 s: no emulador Android cada gesto avança pouco nesta grade de cards grandes.
- takeScreenshot: .maestro/capturas/pokedex-01-grade
- scrollUntilVisible:
    element: "Pikachu.*"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- scrollUntilVisible:
    element: "Clefairy.*"
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- scrollUntilVisible:
    element: "Pikachu.*"
    direction: UP
    timeout: 60000
    visibilityPercentage: 50
    centerElement: true

# Detalhes
- tapOn: "Pikachu.*"
- assertVisible: "Elétrico"
- assertVisible: "Altura: 0.4 m"
- assertVisible: "Peso: 6.0 kg"
# Favorita só se ainda não estiver; o fluxo pode rodar várias vezes.
- runFlow:
    when:
      visible: "Favoritar"
    commands:
      - tapOn: "Favoritar"
- assertVisible: "Remover dos favoritos"
- takeScreenshot: .maestro/capturas/pokedex-02-detalhes
# Elétrico: só Terrestre é fraqueza.
- scrollUntilVisible:
    element: "Fraqueza 2×: Terrestre"
    direction: DOWN
- assertVisible: "Resistência ½×: Elétrico, Voador, Aço"
- scrollUntilVisible:
    element: "Habilidades"
    direction: DOWN
- tapOn: "Habilidades"
# O acordeão pode abrir na beirada da tela; rola até o conteúdo aparecer.
- scrollUntilVisible:
    element: "Static"
    direction: DOWN
# Golpes: abre em Nível; Thunderbolt é de MT.
- scrollUntilVisible:
    element: "Golpes"
    direction: DOWN
- tapOn: "Golpes"
- scrollUntilVisible:
    element: "Thunder Shock"
    direction: DOWN
- tapOn: "MT"
- scrollUntilVisible:
    element: "Thunderbolt"
    direction: DOWN
- takeScreenshot: .maestro/capturas/pokedex-03-golpes
- runFlow: subflows/voltar.yaml

# Favoritos
- tapOn: "Favoritos"
- assertVisible: "Pikachu.*"
- takeScreenshot: .maestro/capturas/pokedex-04-favoritos
